name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore KrOn.Core.slnx
      - name: Build
        run: dotnet build KrOn.Core.slnx --no-restore -c Release
      - name: Test
        run: dotnet test KREAN.Tests/KREAN.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test.trx"
